<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Fortune Texugo</title><style>body{font:16px Arial;background:#1b0a0d;color:#f4d69c;max-width:760px;margin:50px auto;padding:20px}input,button{padding:12px;margin:5px;background:#32161a;color:#ffe4aa;border:1px solid #b58b4d;border-radius:6px}button{cursor:pointer}section{border:1px solid #ad7e41;padding:20px;border-radius:12px;margin:20px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><h1>⚜ FORTUNE TEXUGO — ADMIN</h1><p>Somente administradores cadastrados no Supabase Auth.</p><section><input id="email" type="email" placeholder="E-mail"><input id="password" type="password" placeholder="Senha"><button id="login">Entrar</button></section><section><button id="stats">Atualizar estatísticas</button><pre id="output">Configure o Supabase para utilizar o painel.</pre></section><section><input id="code" placeholder="Código de retirada"><button id="redeem">Confirmar retirada</button></section><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';const CONFIG={SUPABASE_URL:'',SUPABASE_ANON_KEY:''};const $=id=>document.getElementById(id);const ok=!!(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY);const db=ok?createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY):null;const out=x=>$('output').textContent=typeof x==='string'?x:JSON.stringify(x,null,2);$('login').onclick=async()=>{if(!ok)return out('Configure SUPABASE_URL e SUPABASE_ANON_KEY');const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});out(error?error.message:'Login realizado')};async function action(a,code){if(!ok)return out('Configure Supabase');const {data:{session}}=await db.auth.getSession();if(!session)return out('Faça login');const r=await fetch(CONFIG.SUPABASE_URL+'/functions/v1/admin',{method:'POST',headers:{'Content-Type':'application/json',apikey:CONFIG.SUPABASE_ANON_KEY,Authorization:'Bearer '+session.access_token},body:JSON.stringify({action:a,code})});out(await r.json())}$('stats').onclick=()=>action('stats');$('redeem').onclick=()=>action('redeem',$('code').value.trim().toUpperCase());
</script></body></html>
